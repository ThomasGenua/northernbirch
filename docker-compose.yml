services:
  postgres:
    image: postgres:16-alpine
    container_name: nbcu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nbcu
      POSTGRES_USER: nbcu
      POSTGRES_PASSWORD: nbcu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nbcu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbcu -d nbcu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nbcu_postgres_data:
