# Every check in this repo has, until now, only ever run on one developer's
# machine: 520 browser assertions, 23 unit tests, a linter and two build-time
# validators, none of them wired to anything that would notice a regression.
# This runs them on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that is fast, and the build the browser shards test against.
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (/api/chat)
        run: npm test

      # Builds the client, the server bundle, and the 37 prerendered pages --
      # and runs check-rates and check-routes on the way, which is where a
      # contradictory rate or an unwired route stops.
      - name: Build
        run: npm run build

      # Built once and handed to every shard, rather than rebuilt four times:
      # a few seconds cheaper, and it means the four of them are demonstrably
      # testing the same bytes. It is also here to be downloaded when a suite
      # fails and the built page needs looking at rather than reading about.
      - name: Hand the built site to the browser shards
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5

  # The browser suites took 24m30s in one job on a 2-core runner -- about twice
  # what they take on a developer machine, and long enough that nobody waits for
  # the answer. They are 34 independent processes against a static server, so
  # they split across machines with nothing to coordinate.
  browser:
    name: Browser suites (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard's failure should not hide the other three's results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # For playwright-core and axe-core; the suites are plain node scripts.
      - run: npm ci

      - name: Fetch the built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # playwright-core ships no browser of its own. Install just Chromium, and
      # cache it: it is ~170MB and does not change between runs.
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The CLI version must match the installed playwright-core: each release
      # expects a specific Chromium revision, and executablePath() below looks
      # for exactly that one. Pinning a different version installs a browser
      # the library will not find.
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install-deps chromium

      # The suites resolve a browser through CHROME_PATH before anything else.
      # $(...) opens its own quoting context in bash, independent of the
      # surrounding double quotes, so the single-quoted node argument needs no
      # escaping -- backslash-escaping the inner quotes (as an earlier version
      # of this line did) makes bash pass literal backslashes to node, which
      # is a syntax error it reports as "Expected unicode escape". That failure
      # left CHROME_PATH empty, and the suites silently fell back to whatever
      # Chrome CANDIDATES in tests/browser/env.mjs found next -- this runner's
      # pre-installed system Chrome, not the pinned build the step above just
      # downloaded and cached.
      - name: Point the suites at it
        run: echo "CHROME_PATH=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"

      # job-total is the length of the matrix above, so the split can only ever
      # be over the number of machines actually running it. If it failed to
      # expand, run.mjs rejects the argument rather than quietly running a
      # fraction of the suites and reporting success.
      - name: Browser suites
        run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
