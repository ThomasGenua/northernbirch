<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Northern Birch Credit Union">
  <!-- The same mark the nav renders: a birch-to-navy gradient disc with the
       NB monogram. Colours are C.birch and C.navy from the app's palette. -->
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8B88A"/>
      <stop offset="1" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#nb)"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"
        fill="#ffffff" letter-spacing="0.5">NB</text>
</svg>
