  <body>
    <!--
      Netlify detects forms by parsing the deployed HTML at build time, and a
      React-rendered form is invisible to that parser. These hidden copies are
      what register the forms; the app posts to them at runtime via submitForm().
      Field names here must match the keys sent from src/App.jsx.
      bot-field is the honeypot: real people never fill it in.
    -->
    <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="consent" /><input type="text" name="consentVersion" />
      <input type="text" name="bot-field" />
      <input type="text" name="branch" /><input type="text" name="service" />
      <input type="text" name="date" /><input type="text" name="time" />
      <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="phone" />
    </form>
    <form name="claim" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="consent" /><input type="text" name="consentVersion" />
      <input type="text" name="bot-field" />
      <input type="text" name="claimType" /><input type="text" name="policy" /><input type="text" name="incidentDate" />
      <textarea name="details"></textarea>
      <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="phone" />
    </form>
    <form name="referral" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="consent" /><input type="text" name="consentVersion" />
      <input type="text" name="bot-field" />
      <input type="text" name="yourName" /><input type="text" name="memberNo" />
      <input type="text" name="friendName" /><input type="email" name="friendEmail" />
    </form>
    <div id="root"></div>
  </body>
