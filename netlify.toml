[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 8080

# Serve index.html for client-side routes so /mortgages and friends survive a
# refresh or a direct link. Not forced, so real files, the /api/chat function
# and Netlify Forms posts are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline security headers. The Next.js copy of this app got these in the
# security audit; the deployed site never had them.
#
# CSP notes: the app styles every element with inline React `style` props and
# an inline <style> block in index.html, so 'unsafe-inline' is required for
# styles. Scripts are bundled to same-origin files and need no such exception.
[[headers]]
  for = "/*"
  [headers.values]
    # Netlify serves HTTPS but does not send HSTS for you. Without it a member's
    # first request of the day can still be attempted over http and downgraded.
    # includeSubDomains and preload are deliberate further steps: both need every
    # subdomain confirmed HTTPS first, and preload is hard to reverse.
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # plausible.io is listed so that consent-gated measurement can work when a
    # domain is configured (VITE_PLAUSIBLE_DOMAIN). With no domain set the site
    # never loads the script and never contacts the host, so allowing it here
    # changes nothing until someone turns measurement on -- and without it,
    # turning measurement on would fail silently, blocked by this header.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Vite content-hashes every filename in /assets, so a given URL's bytes never
# change. Caching them forever is safe and makes a repeat visit cost nothing;
# a deploy produces new filenames. The HTML must NOT be cached this way or the
# deploy would never be picked up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
